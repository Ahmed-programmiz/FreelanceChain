<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FreelanceChain, an educational freelancer hiring dApp using the Ethereum Sepolia testnet and milestone escrow." />
  <title>FreelanceChain | Sepolia freelancer escrow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" id="brand-link" aria-label="FreelanceChain home">
        <span class="brand-mark">FC</span>
        <span class="brand-text"><b>FreelanceChain</b><small>WEB3 WORKSPACE</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav" id="main-nav" aria-label="Main navigation">
        <button type="button" class="active" data-page="overview" title="Overview"><span class="nav-icon">◫</span><span class="nav-text">Overview</span></button>
        <button type="button" data-page="jobs" title="Jobs & escrow"><span class="nav-icon">▣</span><span class="nav-text">Jobs & escrow</span></button>
        <button type="button" data-page="create" title="Create a job"><span class="nav-icon">＋</span><span class="nav-text">Create a job</span></button>
        <button type="button" data-page="records" title="Messages & evidence"><span class="nav-icon">✎</span><span class="nav-text">Messages & evidence</span></button>
        <button type="button" data-page="disputes" title="Disputes"><span class="nav-icon">⚖</span><span class="nav-text">Disputes</span></button>
        <button type="button" data-page="setup" title="Setup"><span class="nav-icon">⚙</span><span class="nav-text">Sepolia setup</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div style="font-weight:750"><span class="tiny-signal"></span>Student project</div>
        <p>Real Sepolia escrow. Demo-only messages, pause and voting. Never send real ETH.</p>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">FREELANCECHAIN / <strong id="breadcrumb-title">Overview</strong></div>
        <div class="top-actions">
          <span class="network-chip">● SEPOLIA TESTNET</span>
          <span class="mode-chip" id="mode-chip">DEMO MODE</span>
          <button class="btn btn-soft btn-sm" type="button" id="wallet-btn" data-action="wallet-connect">◇ Connect MetaMask</button>
        </div>
      </header>
      <main class="content" id="page" aria-live="polite"></main>
    </div>
  </div>
  <div class="toast-area" id="toasts" role="status" aria-live="polite"></div>
  <!-- ethers.js v6 for actual MetaMask / Sepolia transactions. Requires internet. -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
  <script>
/* Application logic is embedded below to meet the assignment's single-HTML-page requirement. */
'use strict';
// All monetary transactions in LIVE mode are on Ethereum Sepolia, not mainnet.
const CHAIN_ID = '0xaa36a7';
const EXPLORER = 'https://sepolia.etherscan.io';
const STORE_KEY = 'freelancechain.student.v1';
const CONTRACT_ABI = [
  'function createJob(address freelancer,string description,string disputeRules,uint256[] amounts,uint256[] deadlines) payable returns (uint256)',
  'function acceptJob(uint256 jobId)',
  'function releaseMilestone(uint256 jobId)',
  'function cancelJob(uint256 jobId)',
  'function getJob(uint256 jobId) view returns (tuple(address client,address freelancer,string description,string disputeRules,uint256[] milestoneAmounts,uint256[] milestoneDeadlines,uint256 currentMilestone,uint256 escrowRemaining,uint8 status))',
  'event JobCreated(uint256 indexed jobId)',
  'event JobAccepted(uint256 indexed jobId)',
  'event MilestoneReleased(uint256 indexed jobId,uint256 amount)',
  'event JobCancelled(uint256 indexed jobId)'
];
const DEMO_CLIENT = '0x5B38Da6a701c568545dCfcB03FcB875f56beddC4';
const DEMO_FREELANCER = '0xAb8483F64d9C6d1EcF9b849Ae677dD3315835cb2';
const dateAfter = days => new Date(Date.now() + days * 86400000).toISOString().slice(0,10);
const toDeadline = value => Math.floor(new Date(`${value}T23:59:00`).getTime() / 1000);
const seed = () => ({
  mode: 'demo', role: 'client', nextDemoId: 2, contractAddress: '', liveIds: [],
  demoJobs: [{ id: 1, client: DEMO_CLIENT, freelancer: DEMO_FREELANCER, description:'Build a portfolio website', disputeRules:'Discuss issues before raising a dispute. Provide evidence for review.', milestoneAmounts:['4000000000000000','6000000000000000'], milestoneDeadlines:[toDeadline(dateAfter(7)),toDeadline(dateAfter(14))], currentMilestone:1, escrowRemaining:'6000000000000000',status:1,demo:true }],
  notes:{}, disputes:{}, paused:{}, activity:[{title:'Demo job loaded', description:'Sample milestone escrow ready to explore',when:new Date().toISOString()}]
});
let saved = (() => {try{return JSON.parse(localStorage.getItem(STORE_KEY))}catch(e){return null}})();
let db = {...seed(), ...(saved && typeof saved==='object' ? saved : {})};
let page = 'overview';
let selectedJobId = 1;
let wallet = '';
let provider = null;
let signer = null;
let contract = null;
let liveJobs = [];
let isBusy = false;
let draft = { freelancer:DEMO_FREELANCER, description:'', rules:'Discuss disagreements first. Use written evidence for any dispute.', milestones:[{amount:'0.004',deadline:dateAfter(7)},{amount:'0.006',deadline:dateAfter(14)}] };
const $ = sel => document.querySelector(sel);
const safe = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const excerpt = (s, n=72) => String(s || '').length>n ? String(s).slice(0,n).trim()+'…' : String(s || '');
const short = str => str ? `${str.slice(0,6)}…${str.slice(-4)}` : 'Not connected';
const fmtDate = sec => {try{return new Date(Number(sec)*1000).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return '—'}};
const pct = (n,max) => max ? Math.round(100*Number(n)/Number(max)) : 0;
function eth(n){let v=BigInt(n||0), sign=v<0n?'-':''; if(v<0n)v=-v;let whole=v/10n**18n,decimal=(v%10n**18n).toString().padStart(18,'0').slice(0,6).replace(/0+$/,'');return sign+whole.toString()+(decimal?'.'+decimal:'')}
function parseEth(value){let s=String(value).trim();if(!/^\d+(\.\d{1,18})?$/.test(s))throw Error('Enter a positive ETH amount (up to 18 decimal places).');let [a,b='']=s.split('.');return BigInt(a)*10n**18n+BigInt((b+'0'.repeat(18)).slice(0,18))}
const totalWei = j => j.milestoneAmounts.reduce((acc, x)=>acc+BigInt(x),0n);
const getJobs = () => db.mode === 'demo' ? db.demoJobs : liveJobs;
const keyOf = id => `${db.mode}:${id}`;
const recordActivity = (title,description) => {db.activity.unshift({title,description,when:new Date().toISOString()});db.activity=db.activity.slice(0,16);store()};
function store(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}
function alertUser(msg, error=false, url=''){
 const el=document.createElement('div');el.className='toast'+(error?' error':'');
 el.innerHTML=`<b>${error?'Action needs attention':'FreelanceChain'}</b>${safe(msg)}${url?`<a href="${safe(url)}" target="_blank" rel="noopener noreferrer">View transaction on Sepolia ↗</a>`:''}`;
 $('#toasts').prepend(el);setTimeout(()=>el.remove(),8500);
}
function checkReady(){if(db.mode !== 'live') throw Error('Switch to Live Sepolia mode first.');if(!wallet)throw Error('Connect MetaMask first.');if(!contract)throw Error('Save a deployed Sepolia contract address in Setup first.');return true}
function actorRole(job){if(db.mode==='demo')return db.role;if(!wallet)return 'viewer';if(wallet.toLowerCase()===job.client.toLowerCase())return 'client';if(wallet.toLowerCase()===job.freelancer.toLowerCase())return 'freelancer';return 'viewer'}
function statusLabel(status){return ['Open','Active','Completed','Cancelled'][status]||'Unknown'}
function statusChip(status){const s=statusLabel(status);return `<span class="status ${s.toLowerCase()}">${s}</span>`}
function demoTag(){return db.mode==='demo'?'<span class="status mock">SIMULATED</span>':''}
function jobData(raw,id){let r=raw;return {id:Number(id),client:r.client,freelancer:r.freelancer,description:r.description,disputeRules:r.disputeRules,milestoneAmounts:Array.from(r.milestoneAmounts,x=>x.toString()),milestoneDeadlines:Array.from(r.milestoneDeadlines,x=>Number(x)),currentMilestone:Number(r.currentMilestone),escrowRemaining:r.escrowRemaining.toString(),status:Number(r.status),demo:false}}
function title(s){return safe(excerpt(s,84))}
function boardStats(){let jobs=getJobs();let locked=jobs.reduce((a,j)=>a+BigInt(j.escrowRemaining||0),0n);let paid=jobs.reduce((a,j)=>a+totalWei(j)-BigInt(j.escrowRemaining||0)-(j.status===3?totalWei(j):0n),0n);return `<section class="metrics"><div class="metric"><span>Known agreements</span><b>${jobs.length}</b><small>Jobs available in this browser</small></div><div class="metric"><span>Escrow remaining</span><b>${eth(locked)} ETH</b><small>${db.mode==='demo'?'Illustrative balance':'Known Sepolia contracts'}</small></div><div class="metric"><span>Milestones released</span><b>${jobs.reduce((a,j)=>a+j.currentMilestone,0)}</b><small>${db.mode==='demo'?'Simulation progress':'Confirmed on-chain state'}</small></div></section>`}
function jobCard(job){let done=job.currentMilestone,total=job.milestoneAmounts.length;let role=actorRole(job);let pause=!!db.paused[keyOf(job.id)];
 return `<article class="job-card"><div class="job-top"><div><div class="text-sm muted">AGREEMENT #${job.id} · ${safe(role.toUpperCase())}</div><h3>${title(job.description)}</h3></div>${statusChip(job.status)}</div><p>${safe(excerpt(job.disputeRules,94))}</p><div class="job-stats"><div><span>Total budget</span><b>${eth(totalWei(job))} test ETH</b></div><div><span>Escrow balance</span><b>${eth(job.escrowRemaining)} ETH</b></div><div><span>Milestones</span><b>${done}/${total}</b></div></div><div class="progress" aria-label="Payment progress ${pct(done,total)}%"><div class="progress-fill" style="width:${pct(done,total)}%"></div></div>${pause?'<p><span class="status mock">DEMO PAUSE · not enforced on-chain</span></p>':''}<div class="job-actions"><button class="btn btn-sm btn-soft" data-action="view-job" data-id="${job.id}">View agreement ↗</button>${job.status===0&&role==='freelancer'?`<button class="btn btn-primary btn-sm" data-action="accept" data-id="${job.id}">Accept offer</button>`:''}${job.status===1&&role==='client'?`<button class="btn btn-primary btn-sm" data-action="release" data-id="${job.id}" ${pause&&db.mode==='demo'?'disabled title="Resume the demo first"':''}>Release next milestone</button>`:''}</div></article>`}
function renderOverview(){let jobs=getJobs().filter(j=>db.mode==='demo'||actorRole(j)!=='viewer');return `<section class="hero"><div><div class="eyebrow">SMART CONTRACT FREELANCING / SEPOLIA</div><h1>Work agreed.<br><span class="accent">Payments protected.</span></h1><p class="lead">Create milestone-based agreements, lock fake Sepolia ETH in escrow, and approve payments through a Solidity smart contract. Explore messaging and disputes in transparent demo mode.</p><div class="actions"><button class="btn btn-primary" data-page="create">＋ Create an agreement</button><button class="btn btn-soft" data-page="jobs">Explore jobs ↗</button></div></div><div class="hero-art"><div class="orbit"><div class="orb-core">⬡</div></div><div class="hero-note">AGREE · BUILD · RELEASE</div></div></section>${boardStats()}<div class="columns"><section class="panel"><div class="panel-head"><h3>${db.mode==='demo'?'Sample jobs':'Your known agreements'}</h3><button class="btn btn-sm btn-ghost" data-page="jobs">View all ↗</button></div><div class="card-list">${jobs.length?jobs.slice(0,3).map(jobCard).join(''):'<div class="empty"><div class="symbol">▣</div>No known jobs yet. Create or import an agreement.</div>'}</div></section><aside class="stack"><section class="panel"><h3>How escrow works</h3><div class="steps"><div class="step"><span class="step-index">1</span><div><b>Client creates job</b><small>Freelancer, requirements, milestone amounts and deadlines.</small></div></div><div class="step"><span class="step-index">2</span><div><b>Freelancer accepts</b><small>Acceptance activates the on-chain agreement.</small></div></div><div class="step"><span class="step-index">3</span><div><b>Client releases payments</b><small>Payments move from contract escrow to the freelancer.</small></div></div><div class="step"><span class="step-index">4</span><div><b>Resolve disagreements</b><small>Voting, penalties and appeals are illustrative only in v1.</small></div></div></div></section><section class="panel"><h3>Operating mode</h3><p class="sub text-sm">Demo requires no wallet. Live Sepolia sends real testnet transactions and requires your deployed contract.</p>${modeSelector()}<p class="footnote" style="margin:12px 0 0">Sepolia ETH has no real monetary value. No real SOL token is used.</p></section></aside></div>`}
function modeSelector(){return `<div class="switcher" role="group" aria-label="Blockchain mode"><button data-action="set-mode" data-mode="demo" class="${db.mode==='demo'?'selected':''}">Demo preview</button><button data-action="set-mode" data-mode="live" class="${db.mode==='live'?'selected':''}">Live Sepolia</button></div>`}
function renderJobs(){let jobs=getJobs();let filtered=jobs.filter(j=>db.mode==='demo'||!wallet||actorRole(j)!=='viewer');let privacyNote=db.mode==='live'?'This contract has no on-chain job listing function. We save job IDs in this browser; import an ID to view another agreement. Only wallet-authorized actions can change it.':'Demo jobs are simulated in this browser.';
return `<div class="page-head"><div><div class="eyebrow">CONTRACT WORKSPACE</div><h2>Jobs & escrow</h2><p class="sub">Track milestone payments, review agreement details and manage your jobs.</p></div><button class="btn btn-primary" data-page="create">＋ New job</button></div><div class="notice info">${privacyNote}</div>${db.mode==='live'?`<form id="import-form" class="panel" style="margin-bottom:18px"><div class="split"><div class="field" style="flex:1"><label for="job-lookup">Import an on-chain job by ID</label><input id="job-lookup" name="jobId" inputmode="numeric" required placeholder="For example: 1" /></div><button class="btn btn-soft" type="submit" style="align-self:end">Import job</button></div></form>`:`<div class="filterline"><label>Preview identity</label>${roleSelector()}</div>`}<div class="card-list">${filtered.length?filtered.map(jobCard).join(''):'<div class="empty"><div class="symbol">▢</div>No jobs in this view. Import a job ID or create a new agreement.</div>'}</div>`}
function roleSelector(){return `<div class="switcher"><button data-action="set-role" data-role="client" class="${db.role==='client'?'selected':''}">Client</button><button data-action="set-role" data-role="freelancer" class="${db.role==='freelancer'?'selected':''}">Freelancer</button></div>`}
function renderCreate(){const rows=draft.milestones.map((m,i)=>`<div class="milestone-edit"><div class="field"><label>Milestone ${i+1}: Amount (ETH)</label><input type="text" inputmode="decimal" data-mile="${i}" data-field="amount" value="${safe(m.amount)}" required /></div><div class="field"><label>Deadline</label><input type="date" data-mile="${i}" data-field="deadline" min="${dateAfter(1)}" value="${safe(m.deadline)}" required /></div><button type="button" data-action="remove-milestone" data-index="${i}" class="btn btn-sm btn-danger" aria-label="Remove milestone" ${draft.milestones.length===1?'disabled':''}>×</button></div>`).join('');let sum=0n;try{sum=draft.milestones.reduce((a,m)=>a+parseEth(m.amount||'0'),0n)}catch(e){};
return `<div class="page-head"><div><div class="eyebrow">CLIENT WORKSPACE</div><h2>Create a job offer</h2><p class="sub">Define the agreement first. The freelancer must accept before work begins.</p></div>${demoTag()}</div>${db.mode==='live'?'<div class="notice">Live mode: clicking Create will request an actual MetaMask transaction using fake Sepolia ETH. The total escrow must be available in your wallet, plus gas fees.</div>':'<div class="notice info">Demo mode: agreement creation is simulated locally. Switch to Live Sepolia to deposit test ETH in the deployed smart contract.</div>'}<form id="create-form" class="panel"><div class="form-grid"><div class="field full"><label for="freelancer-input">Freelancer wallet address</label><input id="freelancer-input" name="freelancer" data-draft="freelancer" value="${safe(draft.freelancer)}" placeholder="0x..." required /><small>Must be a different wallet from the client.</small></div><div class="field full"><label for="description-input">Job description and requirements</label><textarea id="description-input" name="description" data-draft="description" required placeholder="What will the freelancer deliver?">${safe(draft.description)}</textarea></div><div class="field full"><label for="rules-input">Agreement and dispute rules</label><textarea id="rules-input" name="rules" data-draft="rules" required>${safe(draft.rules)}</textarea><small>Stored on-chain as text. Actual dispute enforcement is a future feature.</small></div></div><hr class="divider"/><div class="panel-head"><h3>Milestone payment plan</h3><button type="button" class="btn btn-sm btn-soft" data-action="add-milestone" ${draft.milestones.length>=10?'disabled':''}>＋ Add milestone</button></div><div id="milestone-rows">${rows}</div><div class="sum-band"><span>Client escrow deposit<br><span class="sub text-sm">All milestones funded upfront</span></span><b>${eth(sum)} Sepolia ETH</b></div><button type="submit" class="btn btn-primary" ${isBusy?'disabled':''}>${db.mode==='demo'?'Create simulated job':'Create job & lock test ETH'} →</button></form>`}
function viewJob(job){let role=actorRole(job), paused=!!db.paused[keyOf(job.id)];let rows=job.milestoneAmounts.map((amt,i)=>`<div class="milestone-line"><div><strong><span class="milestone-dot ${i<job.currentMilestone?'done':''}"></span>Milestone ${i+1}</strong><small>Deadline: ${fmtDate(job.milestoneDeadlines[i])}</small></div><div style="text-align:right"><b>${eth(amt)} ETH</b><div class="text-sm ${i<job.currentMilestone?'accent':'muted'}">${i<job.currentMilestone?'Released':job.status===3?'Cancelled':i===job.currentMilestone&&job.status===1?'Next payment':'Unpaid'}</div></div></div>`).join('');
return `<div class="page-head"><div><div class="eyebrow">AGREEMENT #${job.id}</div><h2>${title(job.description)}</h2><p class="sub">Created and managed by the client and the named freelancer.</p></div>${statusChip(job.status)}</div><div class="columns"><section class="stack"><div class="panel"><div class="panel-head"><h3>Escrow overview</h3>${demoTag()}</div><div class="job-stats"><div><span>Original deposit</span><b>${eth(totalWei(job))} ETH</b></div><div><span>Still locked</span><b>${eth(job.escrowRemaining)} ETH</b></div><div><span>Released milestones</span><b>${job.currentMilestone}/${job.milestoneAmounts.length}</b></div></div><div class="progress"><div class="progress-fill" style="width:${pct(job.currentMilestone,job.milestoneAmounts.length)}%"></div></div><hr class="divider"/><h3>Milestone schedule</h3>${rows}<div class="job-actions">${job.status===0&&role==='freelancer'?`<button class="btn btn-primary" data-action="accept" data-id="${job.id}">Accept agreement</button>`:''}${job.status===0&&role==='client'?`<button class="btn btn-danger" data-action="cancel" data-id="${job.id}">Cancel open offer & refund</button>`:''}${job.status===1&&role==='client'?`<button class="btn btn-primary" data-action="release" data-id="${job.id}" ${paused&&db.mode==='demo'?'disabled':''}>Release next milestone</button>`:''}${job.status===1?`<button class="btn btn-soft" data-action="toggle-pause" data-id="${job.id}">${paused?'Resume (demo)':'Pause (demo)'}</button><button class="btn btn-soft" data-action="cancel-request" data-id="${job.id}">Request cancellation</button>`:''}<button class="btn btn-ghost" data-page="records">Messages & evidence ↗</button><button class="btn btn-ghost" data-page="disputes">Dispute panel ↗</button></div>${paused?'<p class="notice" style="margin-top:15px">Paused in the browser demo only. An on-chain milestone release can still occur in Live mode.</p>':''}</div></section><aside class="stack"><div class="panel"><h3>Agreement details</h3><div class="kv"><div class="label">Client</div><div class="value mono">${safe(short(job.client))}</div></div><div class="kv"><div class="label">Freelancer</div><div class="value mono">${safe(short(job.freelancer))}</div></div><div class="kv"><div class="label">My role</div><div class="value">${safe(role)}</div></div><div class="kv"><div class="label">Contract state</div><div class="value">${statusLabel(job.status)}</div></div><hr class="divider"/><h3>Description</h3><p class="sub">${safe(job.description)}</p><h3>Dispute rules</h3><p class="sub">${safe(job.disputeRules)}</p></div><div class="notice">Deadline recording, active-job pause, active-job cancellation, and juror decisions are <b>not enforced</b> by this five-function Solidity contract.</div></aside></div>`}
function renderRecords(){let jobs=getJobs(),j=jobs.find(j=>Number(j.id)===Number(selectedJobId))||jobs[0];if(j)selectedJobId=j.id;let items=j?(db.notes[keyOf(j.id)]||[]):[];
return `<div class="page-head"><div><div class="eyebrow">COLLABORATION</div><h2>Messages & evidence</h2><p class="sub">Keep a visible record of updates, delivery links and supporting files.</p></div><span class="status mock">BROWSER-ONLY RECORDS</span></div><div class="notice">These records are saved only in this browser's local storage. They are not blockchain evidence, cryptographically signed, shared between wallets or suitable for confidential documents.</div><div class="columns"><section class="panel"><div class="field" style="margin-bottom:18px"><label>Agreement</label>${jobSelect(jobs,j)}</div><div class="thread">${items.length?items.slice().reverse().map(r=>`<article class="record"><strong>${r.kind==='evidence'?'◉ Evidence':'◌ Message'} · ${safe(r.author)}</strong><time>${new Date(r.at).toLocaleString()}</time><p>${safe(r.text)}</p>${r.url?`<a href="${safe(r.url)}" target="_blank" rel="noopener noreferrer">Open supporting link ↗</a>`:''}</article>`).join(''):'<div class="empty">No records for this agreement yet.</div>'}</div></section><aside class="panel"><h3>Add a record</h3><form id="record-form"><div class="field"><label>Type</label><select name="kind"><option value="message">Message</option><option value="evidence">Evidence</option></select></div><div class="field" style="margin-top:15px"><label>Update or evidence description</label><textarea name="text" required placeholder="Example: I have uploaded the first design draft."></textarea></div><div class="field" style="margin-top:15px"><label>Supporting URL (optional)</label><input name="url" type="url" placeholder="https://example.com/my-work"/></div><button class="btn btn-primary" style="margin-top:18px" type="submit" ${!j?'disabled':''}>Save browser record</button></form></aside></div>`}
function jobSelect(jobs,j){return `<select data-action="select-job" aria-label="Choose job">${jobs.map(x=>`<option value="${x.id}" ${j&&x.id===j.id?'selected':''}>#${x.id} · ${safe(excerpt(x.description,35))}</option>`).join('')}</select>`}
function computeAward(j,decision){let rem=BigInt(j.escrowRemaining);let toFreelancer=decision==='freelancer'?rem:decision==='split'?rem/2n:0n;let toClient=rem-toFreelancer;return {toClient,toFreelancer}}
function renderDisputes(){let jobs=getJobs(),j=jobs.find(j=>Number(j.id)===Number(selectedJobId))||jobs[0];if(j)selectedJobId=j.id;let ds=j?db.disputes[keyOf(j.id)]:null;let n=ds?ds.votes.length:0;let decisions={client:'Client',freelancer:'Freelancer',split:'Split'};
return `<div class="page-head"><div><div class="eyebrow">DECENTRALIZED JUSTICE CONCEPT</div><h2>Dispute simulation</h2><p class="sub">Explore voting, proposed refunds, mock penalties and appeals.</p></div><span class="status mock">NOT ON CHAIN</span></div><div class="notice critical"><b>Important:</b> This is an educational, local voting simulation. It does not select independent jurors, change the contract's escrow balance, transfer ETH, enforce penalties or pause payments. Never represent it as real decentralized arbitration.</div><div class="columns"><section class="stack"><div class="panel"><div class="field" style="margin-bottom:15px"><label>Agreement to review</label>${jobSelect(jobs,j)}</div>${!j?'<div class="empty">Create or import a job first.</div>':!ds?`<h3>Open a case for Job #${j.id}</h3><p class="sub">Record the disagreement before inviting mock jurors to vote.</p><form id="dispute-form"><div class="field"><label>Reason for dispute</label><textarea name="reason" required placeholder="Describe the disagreement and the evidence available."></textarea></div><button class="btn btn-primary" style="margin-top:16px" type="submit">Start simulated dispute</button></form>`:`<div class="split"><h3>Case for Job #${j.id}</h3><span class="status ${ds.stage==='appeal'?'mock':'active'}">${ds.stage==='appeal'?'Appeal round':ds.stage==='decision'?'Decision recorded':'Voting'}</span></div><p class="sub">${safe(ds.reason)}</p><div class="kv"><span class="label">Voting round</span><strong class="value">${ds.round}</strong></div><div class="kv"><span class="label">Mock jurors who voted</span><strong class="value">${n} / 3</strong></div>${ds.stage==='voting'||ds.stage==='appeal'?`<hr class="divider"/><h3>Cast a sample juror vote</h3><p class="sub text-sm">For classroom demonstration, you can cast all three votes yourself. This is not independent or decentralized voting.</p><div class="vote-grid">${Object.entries(decisions).map(([v,label])=>`<div class="vote-option"><b>${ds.votes.filter(x=>x===v).length}</b><div class="text-sm" style="margin-bottom:9px">${label} wins${v==='split'?' / shared':''}</div><button class="btn btn-sm btn-soft" data-action="vote" data-choice="${v}" ${n>=3?'disabled':''}>Vote</button></div>`).join('')}</div>`:''}${ds.stage==='decision'?`<div class="decision"><div class="eyebrow">${ds.round===1?'First decision':'Appeal decision'}</div><h3 style="margin-top:7px">${safe(decisions[ds.decision])} ${ds.decision==='split'?'outcome':'wins'} (mock)</h3><p class="sub text-sm">The result is calculated from three browser clicks. No on-chain settlement happens.</p></div><div class="job-actions">${ds.round===1?'<button class="btn btn-soft" data-action="appeal">Request appeal</button>':'<span class="status completed">Appeal completed (demo)</span>'}</div>`:''}<button class="btn btn-ghost btn-sm" style="margin-top:18px" data-action="reset-dispute">Reset local simulation</button>`}</div></section><aside class="stack"><div class="panel"><h3>Proposed settlement</h3>${j&&ds&&ds.decision?(()=>{let a=computeAward(j,ds.decision);return `<div class="kv"><span class="label">Client refund (mock)</span><b class="value">${eth(a.toClient)} ETH</b></div><div class="kv"><span class="label">Freelancer payout (mock)</span><b class="value">${eth(a.toFreelancer)} ETH</b></div><div class="kv"><span class="label">Penalty proposal</span><b class="value">5% of a hypothetical posted security stake</b></div><p class="footnote">There is NO security-stake balance in the deployed contract. Therefore no penalty is charged, and no proposed amount is actually sent.</p>`})():'<p class="sub">A proposed refund/payout appears after the mock jurors vote.</p>'}</div><div class="panel"><h3>Appeal policy (demonstration)</h3><div class="steps"><div class="step"><span class="step-index">1</span><div><b>Record dispute</b><small>Give reason and supporting evidence.</small></div></div><div class="step"><span class="step-index">2</span><div><b>Three sample votes</b><small>Majority wins. All different results lead to Split.</small></div></div><div class="step"><span class="step-index">3</span><div><b>Appeal</b><small>A fresh round simulates an appeal decision.</small></div></div></div></div></aside></div>`}
function renderSetup(){return `<div class="page-head"><div><div class="eyebrow">BLOCKCHAIN CONNECTION</div><h2>Sepolia & MetaMask setup</h2><p class="sub">Connect the website to your deployed FreelanceChain contract.</p></div></div><div class="columns"><section class="panel"><h3>1. Choose your operating mode</h3><p class="sub text-sm">Start in Demo mode to explore. Live mode sends testnet transactions after you connect a wallet.</p>${modeSelector()}<hr class="divider"/><h3>2. Connect MetaMask</h3><div class="kv"><span class="label">Wallet</span><span class="value mono">${safe(wallet||'Not connected')}</span></div><div class="kv"><span class="label">Network required</span><span class="value">Ethereum Sepolia (11155111)</span></div><button class="btn btn-primary" data-action="wallet-connect" style="margin-top:16px">◇ ${wallet?'Reconnect wallet':'Connect MetaMask'}</button><hr class="divider"/><h3>3. Set deployed contract address</h3><p class="sub text-sm">After deploying from Remix's Browser Extension environment, copy the new 0x... contract address here.</p><form id="contract-form"><div class="field"><label>Contract address (Sepolia only)</label><input id="contract-address" name="address" placeholder="0x..." value="${safe(db.contractAddress)}" required/></div><button class="btn btn-soft" style="margin-top:13px" type="submit">Save contract address</button></form><p class="footnote">Current setup: ${contract&&wallet?'Contract connected to MetaMask.':'Deployment or wallet connection needed.'}</p></section><aside class="stack"><div class="panel"><h3>Deployment checklist</h3><div class="steps"><div class="step"><span class="step-index">1</span><div><b>Get free Sepolia ETH</b><small>Use a reputable testnet faucet; no real-value ETH required.</small></div></div><div class="step"><span class="step-index">2</span><div><b>Compile SmartContract.sol</b><small>Use Remix Solidity Compiler and choose FreelanceChain.</small></div></div><div class="step"><span class="step-index">3</span><div><b>Deploy via Browser Extension</b><small>Connect MetaMask on Sepolia. Value = 0 for deployment.</small></div></div><div class="step"><span class="step-index">4</span><div><b>Paste deployed address above</b><small>Connect MetaMask and choose Live Sepolia mode.</small></div></div></div><div class="job-actions"><a class="btn btn-sm btn-soft" target="_blank" rel="noopener noreferrer" href="https://remix.ethereum.org/">Open Remix ↗</a><a class="btn btn-sm btn-soft" target="_blank" rel="noopener noreferrer" href="https://sepolia.etherscan.io/">Sepolia explorer ↗</a></div></div><div class="notice">Never paste your recovery phrase or private key anywhere on this site. MetaMask will ask you to approve transactions separately.</div></aside></div>`}
function render(){let names={overview:'Overview',jobs:'Jobs & escrow',create:'Create a job',job:'Agreement details',records:'Messages & evidence',disputes:'Dispute demo',setup:'Sepolia setup'};$('#breadcrumb-title').textContent=names[page]||'Overview';$('#mode-chip').textContent=db.mode==='demo'?'DEMO MODE':'LIVE SEPOLIA';$('#wallet-btn').textContent=wallet?'◇ '+short(wallet):'◇ Connect MetaMask';document.querySelectorAll('#main-nav button').forEach(el=>el.classList.toggle('active',el.dataset.page===page));let content;
switch(page){case 'jobs':content=renderJobs();break;case 'create':content=renderCreate();break;case 'job':{let j=getJobs().find(x=>Number(x.id)===Number(selectedJobId));content=j?viewJob(j):renderJobs();break}case 'records':content=renderRecords();break;case 'disputes':content=renderDisputes();break;case 'setup':content=renderSetup();break;default:content=renderOverview()}
$('#page').innerHTML=content+'<p class="footer-note">FreelanceChain · Educational Sepolia testnet dApp · Disputes and records are demonstrations, not audited smart-contract functionality.</p>'}
function navigate(dest){page=dest;location.hash=dest==='job'?'jobs':dest;render();window.scrollTo({top:0,behavior:'smooth'})}
function saveFormDraft(){let form=$('#create-form');if(!form)return;form.querySelectorAll('[data-draft]').forEach(e=>draft[e.dataset.draft]=e.value);form.querySelectorAll('[data-mile]').forEach(e=>{let i=Number(e.dataset.mile);if(draft.milestones[i])draft.milestones[i][e.dataset.field]=e.value})}
function validateDraft(){let desc=draft.description.trim(),rules=draft.rules.trim(),freelancer=draft.freelancer.trim();if(!/^0x[0-9a-fA-F]{40}$/.test(freelancer))throw Error('Enter a 42-character Ethereum wallet address starting with 0x.');if(!desc||!rules)throw Error('Enter both the job description and dispute rules.');if(db.mode==='live'&&[DEMO_CLIENT,DEMO_FREELANCER].some(address=>address.toLowerCase()===freelancer.toLowerCase()))throw Error('Never use Remix VM sample wallet addresses on Sepolia. Use a real MetaMask account you control.');if(db.mode==='live'&&wallet.toLowerCase()===freelancer.toLowerCase())throw Error('Client and freelancer must be different wallets.');let amounts=draft.milestones.map(m=>parseEth(m.amount)),deadlines=draft.milestones.map(m=>toDeadline(m.deadline));if(amounts.some(n=>n<=0n))throw Error('Each milestone amount must be more than zero.');if(deadlines.some((v,i)=>!Number.isFinite(v)||v<=Math.floor(Date.now()/1000)||i>0&&v<deadlines[i-1]))throw Error('Choose future deadlines in chronological order.');return {desc,rules,freelancer,amounts,deadlines,total:amounts.reduce((a,b)=>a+b,0n)}}
function errorMessage(e){let msg=e?.shortMessage||e?.reason||e?.info?.error?.message||e?.message||String(e);if(e?.code===4001||e?.code==='ACTION_REJECTED')return 'You rejected this request in MetaMask.';let match=String(msg).match(/reverted with reason string ['"]([^'"]+)/);if(match)return match[1];return String(msg).slice(0,260)}
async function addJob(){saveFormDraft();let x=validateDraft();if(db.mode==='demo'){let j={id:db.nextDemoId++,client:DEMO_CLIENT,freelancer:x.freelancer,description:x.desc,disputeRules:x.rules,milestoneAmounts:x.amounts.map(String),milestoneDeadlines:x.deadlines,currentMilestone:0,escrowRemaining:x.total.toString(),status:0,demo:true};db.demoJobs.unshift(j);store();recordActivity('Demo offer created',`Job #${j.id} with ${eth(x.total)} simulated ETH`);selectedJobId=j.id;alertUser('Simulated job created. Switch to Freelancer in Jobs to accept it.');navigate('job');return}
checkReady();await blockchainTx('Creating and funding job',()=>contract.createJob(x.freelancer,x.desc,x.rules,x.amounts,x.deadlines,{value:x.total}),async(receipt)=>{let ev=receipt.logs.map(l=>{try{return contract.interface.parseLog(l)}catch(e){return null}}).find(v=>v&&v.name==='JobCreated');if(!ev)throw Error('Transaction confirmed but job ID could not be decoded. Check Etherscan events and import its ID.');let id=Number(ev.args.jobId);db.liveIds=[...new Set([...db.liveIds,id])];store();selectedJobId=id;await loadAllJobs();recordActivity('Sepolia job created',`Job #${id} confirmed`);navigate('job')})}
async function blockchainTx(title,callback,after){if(isBusy)return;isBusy=true;try{alertUser(title+': confirm the request in MetaMask.');const tx=await callback();alertUser('Transaction submitted. Waiting for Sepolia confirmation...',false,EXPLORER+'/tx/'+tx.hash);const receipt=await tx.wait();if(!receipt||Number(receipt.status)!==1)throw Error('Transaction was not successful.');await after(receipt);alertUser(title+' confirmed on Sepolia.',false,EXPLORER+'/tx/'+tx.hash)}catch(e){alertUser(errorMessage(e),true)}finally{isBusy=false;render()}}
async function jobAction(type,id){let j=getJobs().find(j=>Number(j.id)===Number(id));if(!j)throw Error('Job not found.');let role=actorRole(j);let verbs={accept:'Accepting job',cancel:'Cancelling open job',release:'Releasing milestone'};
if(type==='accept'&&!(role==='freelancer'&&j.status===0))throw Error('Only the named freelancer can accept an open job.');if(type==='cancel'&&!(role==='client'&&j.status===0))throw Error('Only the client can cancel an open job.');if(type==='release'&&!(role==='client'&&j.status===1))throw Error('Only the client can release an active job milestone.');if(type==='release'&&db.paused[keyOf(id)]&&db.mode==='demo')throw Error('Demo job is paused. Resume it first.');
if(db.mode==='demo'){if(type==='accept')j.status=1;else if(type==='cancel'){j.status=3;j.escrowRemaining='0'}else {let amt=BigInt(j.milestoneAmounts[j.currentMilestone]);j.currentMilestone++;j.escrowRemaining=(BigInt(j.escrowRemaining)-amt).toString();if(j.currentMilestone===j.milestoneAmounts.length)j.status=2}store();recordActivity('Demo: '+verbs[type],`Job #${id}`);alertUser(verbs[type]+' completed (browser simulation).');selectedJobId=id;render();return}
checkReady();await blockchainTx(verbs[type],()=>contract[type==='accept'?'acceptJob':type==='cancel'?'cancelJob':'releaseMilestone'](id),async()=>{await loadAllJobs();recordActivity(verbs[type],`Job #${id}`)})}
async function loadAllJobs(){if(!contract){liveJobs=[];render();return}let results=[];for(const id of db.liveIds){try{const raw=await contract.getJob(id);results.push(jobData(raw,id))}catch(e){ /* imported ID not found: keep in registry, show other jobs */ }}liveJobs=results.sort((a,b)=>b.id-a.id);render()}
async function connectWallet(prompt=true){if(!window.ethereum)throw Error('MetaMask was not detected. Open the website in a browser with MetaMask installed.');if(!window.ethers)throw Error('ethers.js did not load. Check your internet connection and reload the page.');let acc=await window.ethereum.request({method:prompt?'eth_requestAccounts':'eth_accounts'});if(!acc||!acc.length){wallet='';contract=null;render();return}let chain=await window.ethereum.request({method:'eth_chainId'});if(chain.toLowerCase()!==CHAIN_ID){if(prompt){try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_ID}]})}catch(e){throw Error('Select Ethereum Sepolia in MetaMask. '+errorMessage(e))}}else{wallet='';contract=null;render();return}}
provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();wallet=await signer.getAddress();await configureContract(false);alertUser('MetaMask connected: '+short(wallet)+' on Sepolia.');render()}
async function configureContract(verify=true){if(!wallet||!provider||!window.ethers){contract=null;return}let addr=db.contractAddress.trim();if(!addr){contract=null;return}if(!ethers.isAddress(addr))throw Error('The saved smart-contract address is invalid.');if(verify){let code=await provider.getCode(addr);if(!code||code==='0x')throw Error('No contract code found at this address on Sepolia. Check your deployment address and network.')}contract=new ethers.Contract(addr,CONTRACT_ABI,signer);await loadAllJobs()}
async function importJob(id){checkReady();let n=Number(id);if(!Number.isSafeInteger(n)||n<1)throw Error('Enter a valid job ID (1 or higher).');const raw=await contract.getJob(n);jobData(raw,n);db.liveIds=[...new Set([...db.liveIds,n])];store();await loadAllJobs();selectedJobId=n;alertUser('Job #'+n+' loaded from Sepolia.');navigate('job')}
function addRecord(form){let jobs=getJobs(),j=jobs.find(j=>Number(j.id)===Number(selectedJobId))||jobs[0];if(!j)throw Error('Create or import a job before adding records.');let text=form.elements.text.value.trim();if(!text)throw Error('Write a message or evidence description.');let rawUrl=form.elements.url.value.trim();let url='';if(rawUrl){let parsed=new URL(rawUrl);if(!['https:','http:'].includes(parsed.protocol))throw Error('Only http(s) links are allowed.');url=parsed.href}let k=keyOf(j.id);db.notes[k] ||= [];db.notes[k].push({kind:form.elements.kind.value,text,url,at:new Date().toISOString(),author:db.mode==='demo'?db.role:(short(wallet)||'Visitor')});store();recordActivity('Browser record added',`Job #${j.id} · ${form.elements.kind.value}`);render();alertUser('Saved locally in this browser (not on-chain).')}
function startDispute(form){let j=getJobs().find(j=>j.id===Number(selectedJobId));if(!j)throw Error('Select a job first.');let reason=form.elements.reason.value.trim();if(!reason)throw Error('Enter a reason.');db.disputes[keyOf(j.id)]={reason,round:1,stage:'voting',votes:[],decision:null};store();render();alertUser('Demo dispute started. No blockchain action occurred.')}
function castVote(choice){let ds=db.disputes[keyOf(selectedJobId)];if(!ds||!['voting','appeal'].includes(ds.stage))throw Error('No voting round available.');if(ds.votes.length>=3)throw Error('All three sample jurors have voted.');ds.votes.push(choice);if(ds.votes.length===3){let counts={client:0,freelancer:0,split:0};ds.votes.forEach(v=>counts[v]++);let winner=Object.entries(counts).find(([k,n])=>n>=2);ds.decision=winner?winner[0]:'split';ds.stage='decision'}store();render();if(ds.stage==='decision')alertUser('Mock vote completed. Review the proposed settlement and optional appeal.')}
function appeal(){let ds=db.disputes[keyOf(selectedJobId)];if(!ds||ds.stage!=='decision'||ds.round!==1)throw Error('Appeal is unavailable.');ds.round=2;ds.stage='appeal';ds.votes=[];ds.decision=null;store();render();alertUser('Appeal round started (browser demo only).')}
// Click controls are delegated so re-rendered panels remain interactive.
document.addEventListener('click',async e=>{let btn=e.target.closest('[data-page],[data-action]');if(!btn||btn.disabled)return;try{
 if(btn.dataset.page){if(page==='create')saveFormDraft();navigate(btn.dataset.page);return}
 const act=btn.dataset.action,id=Number(btn.dataset.id);
 if(act==='wallet-connect'){await connectWallet(true)}
 else if(act==='set-mode'){if(page==='create')saveFormDraft();db.mode=btn.dataset.mode;if(db.mode==='live'&&draft.freelancer.toLowerCase()===DEMO_FREELANCER.toLowerCase())draft.freelancer='';if(db.mode==='demo'&&!draft.freelancer)draft.freelancer=DEMO_FREELANCER;store();if(db.mode==='live'&&contract)await loadAllJobs();render()}
 else if(act==='set-role'){db.role=btn.dataset.role;store();render()}
 else if(act==='view-job'){selectedJobId=id;navigate('job')}
 else if(['accept','cancel','release'].includes(act)){await jobAction(act,id)}
 else if(act==='add-milestone'){saveFormDraft();if(draft.milestones.length<10)draft.milestones.push({amount:'0.001',deadline:dateAfter(21)});render()}
 else if(act==='remove-milestone'){saveFormDraft();draft.milestones.splice(Number(btn.dataset.index),1);render()}
 else if(act==='toggle-pause'){let k=keyOf(id);db.paused[k]=!db.paused[k];store();alertUser('Local demo pause toggled. Solidity contract is unaffected.');render()}
 else if(act==='cancel-request'){let k=keyOf(id);db.notes[k]||=[];db.notes[k].push({kind:'message',text:'Cancellation requested by '+(db.mode==='demo'?db.role:short(wallet))+'. Parties must negotiate. This does not cancel or refund an active on-chain job.',url:'',at:new Date().toISOString(),author:'System demo'});store();alertUser('Cancellation request recorded locally. No funds have moved.');render()}
 else if(act==='vote'){castVote(btn.dataset.choice)}
 else if(act==='appeal'){appeal()}
 else if(act==='reset-dispute'){delete db.disputes[keyOf(selectedJobId)];store();render()}
 }catch(err){alertUser(errorMessage(err),true)}});
document.addEventListener('change',e=>{if(e.target.dataset.action==='select-job'){selectedJobId=Number(e.target.value);render()}if(e.target.dataset.draft){draft[e.target.dataset.draft]=e.target.value}if(e.target.dataset.mile){let m=draft.milestones[Number(e.target.dataset.mile)];if(m)m[e.target.dataset.field]=e.target.value}});
document.addEventListener('input',e=>{if(e.target.dataset.draft)draft[e.target.dataset.draft]=e.target.value;if(e.target.dataset.mile){let m=draft.milestones[Number(e.target.dataset.mile)];if(m)m[e.target.dataset.field]=e.target.value}});
document.addEventListener('submit',async e=>{let form=e.target;if(!['create-form','import-form','record-form','dispute-form','contract-form'].includes(form.id))return;e.preventDefault();try{
 if(form.id==='create-form')await addJob();
 else if(form.id==='import-form')await importJob(form.elements.jobId.value);
 else if(form.id==='record-form')addRecord(form);
 else if(form.id==='dispute-form')startDispute(form);
 else if(form.id==='contract-form'){let addr=form.elements.address.value.trim();if(!window.ethers)throw Error('ethers.js has not loaded. Check your connection.');if(!ethers.isAddress(addr))throw Error('Enter a valid Ethereum contract address.');db.contractAddress=addr;store();if(wallet)await configureContract(true);alertUser('Contract address saved'+(wallet?' and checked on Sepolia':' locally. Connect MetaMask to verify it.')+'.');render()}
 }catch(err){alertUser(errorMessage(err),true)}});
if(window.ethereum){window.ethereum.on?.('accountsChanged',async()=>{try{await connectWallet(false)}catch(e){wallet='';contract=null;render()}});window.ethereum.on?.('chainChanged',()=>{wallet='';contract=null;liveJobs=[];render();alertUser('Network changed. Reconnect on Ethereum Sepolia.',true)})}
render();

  </script>
